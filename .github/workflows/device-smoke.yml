name: Apple Intelligence smoke

on: workflow_dispatch

permissions:
  contents: read

jobs:
  device-smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, macOS, ARM64, apple-intelligence]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - run: npm run build:helper
      - run: test -x bin/apple-fm-helper
      - run: npm run test:device
