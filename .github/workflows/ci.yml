name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

# apple-fm is a macOS-only package (`"os": ["darwin"]` in package.json), so CI
# runs on macOS runners. The unit suite is device-free — it exercises the
# process layer against tests/fixtures/stub-helper.js — so these jobs do NOT
# need Apple Intelligence or the macOS 26 SDK; the helper compile lives in its
# own job below.
jobs:
  # Unit suite on every supported major. The package targets Node 20+, so the
  # floor (20) and current (22) both run; coverage is collected on each.
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: npm ci
      - run: npm test

  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run typecheck

  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run

  # Probe both OS versions without requiring Apple Intelligence to be enabled.
  helper-build:
    strategy:
      matrix:
        runner: [macos-26, xcode-27]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: npm run build:helper
      - name: Verify the native helper lists the on-device model
        run: |
          test -x bin/apple-fm-helper
          bin/apple-fm-helper --probe | jq -e '
            (.models | map(.id)) == ["on-device"] and
            .available == .models[0].available
          '
      - name: Check native guided schema validation
        run: bash tests/native-schema-validation.sh bin/apple-fm-helper
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'xcode-27'
        with:
          name: image-capable-helper
          path: bin/apple-fm-helper

  helper-macos-26-compatibility:
    needs: helper-build
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: image-capable-helper
      - name: Run the SDK 27 helper on macOS 26
        run: |
          chmod +x apple-fm-helper
          ./apple-fm-helper --probe | jq -e '(.models | map(.id)) == ["on-device"]'
          if output=$(printf '%s\n' '{"imagePath":"unused.png","prompt":"Describe it"}' | ./apple-fm-helper --generate-image); then
            exit 1
          fi
          jq -e '.type == "error" and .code == "unsupported"' <<< "$output"
